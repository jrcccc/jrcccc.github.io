<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 16 132 132" width="200" height="200" role="img" aria-label="Illustrated avatar of José R. Correia">
  <defs>
    <clipPath id="frame"><rect x="34" y="16" width="132" height="132"/></clipPath>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C9A8"/>
      <stop offset="1" stop-color="#E2AE8B"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3426"/>
      <stop offset="1" stop-color="#2E2019"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ears -->
    <ellipse cx="55" cy="92" rx="8" ry="12" fill="#E6B391"/>
    <ellipse cx="145" cy="92" rx="8" ry="12" fill="#E6B391"/>

    <!-- head -->
    <path d="M57 72 C57 42 76 28 100 28 C124 28 143 42 143 72 L143 98 C143 128 124 146 100 146 C76 146 57 128 57 98 Z" fill="url(#skin)"/>

    <!-- short beard along jaw + chin -->
    <path d="M58 96 C60 126 78 146 100 146 C122 146 140 126 142 96 C138 112 132 124 124 130 C116 122 84 122 76 130 C68 124 62 112 58 96 Z" fill="#2E2019" opacity="0.92"/>
    <!-- mustache -->
    <path d="M78 106 C86 99 95 100 100 103 C105 100 114 99 122 106 C114 103.5 106 104.5 100 106 C94 104.5 86 103.5 78 106 Z" fill="#3A281E" opacity="0.9"/>

    <!-- big open smile -->
    <path d="M79 110 C80 126 120 126 121 110 Z" fill="#7A2E2A"/>
    <path d="M81 110.5 L119 110.5 L118.6 113.4 C108 114.8 92 114.8 81.4 113.4 Z" fill="#FFFFFF"/>

    <!-- hair: short, side-parted, swept to the right -->
    <path d="M55 74 C52 44 72 22 100 22 C128 22 148 44 145 74 C143 64 139 58 134 55 C122 54 106 52 92 49 C84 47 78 45 74 43 C68 50 62 58 55 74 Z" fill="url(#hair)"/>
    <path d="M74 43 C76 35 79 29 85 24" fill="none" stroke="#7A5A45" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="none" stroke="#5E4434" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
      <path d="M82 33 C98 29 118 33 134 45"/>
      <path d="M84 40 C100 37 117 41 131 50"/>
      <path d="M90 27 C104 25 120 29 132 37"/>
    </g>
    <!-- sideburns -->
    <path d="M56 72 L60 72 L61 92 L57 92 Z" fill="#3A281E"/>
    <path d="M144 72 L140 72 L139 92 L143 92 Z" fill="#3A281E"/>

    <!-- raised eyebrows -->
    <path d="M70 66 C76 60 86 59 92 62" fill="none" stroke="#3A281E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M108 62 C114 59 124 60 130 66" fill="none" stroke="#3A281E" stroke-width="3.5" stroke-linecap="round"/>

    <!-- wide eyes -->
    <ellipse cx="82" cy="78" rx="6.5" ry="6" fill="#FFFFFF"/>
    <ellipse cx="118" cy="78" rx="6.5" ry="6" fill="#FFFFFF"/>
    <circle cx="82" cy="78.5" r="4" fill="#3B2A22"/>
    <circle cx="118" cy="78.5" r="4" fill="#3B2A22"/>
    <circle cx="83.3" cy="77" r="1.2" fill="#FFFFFF"/>
    <circle cx="119.3" cy="77" r="1.2" fill="#FFFFFF"/>

    <!-- nose -->
    <path d="M100 82 C98 90 96 94 98 97 C100 98 103 97 104 95" fill="none" stroke="#C98E6C" stroke-width="2" stroke-linecap="round"/>

    <!-- rimless rectangular glasses -->
    <g fill="#FFFFFF" fill-opacity="0.15" stroke="#AEB6BF" stroke-width="1.2">
      <rect x="66" y="68" width="31" height="21" rx="6"/>
      <rect x="103" y="68" width="31" height="21" rx="6"/>
    </g>
    <path d="M97 74 C99 72 101 72 103 74" fill="none" stroke="#AEB6BF" stroke-width="1.5"/>
    <path d="M66 73 L57 71" stroke="#AEB6BF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M134 73 L143 71" stroke="#AEB6BF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- cheeks -->
    <ellipse cx="72" cy="100" rx="6" ry="3.5" fill="#E58F7A" opacity="0.35"/>
    <ellipse cx="128" cy="100" rx="6" ry="3.5" fill="#E58F7A" opacity="0.35"/>
  </g>
</svg>
